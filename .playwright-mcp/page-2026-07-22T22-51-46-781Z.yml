            - listitem [ref=f11e108]:
              - time [ref=f11e109]: Tue 18:00
              - generic [ref=f11e110]: Mix and first fold — the quiet hour.
            - listitem [ref=f11e111]:
              - time [ref=f11e112]: Wed 08:00
              - generic [ref=f11e113]: Shape, then into the cold room for a slow proof.
            - listitem [ref=f11e114]:
              - time [ref=f11e115]: Thu 05:00
              - generic [ref=f11e116]: Oven lit. Scored, steamed, baked dark.
            - listitem [ref=f11e117]:
              - time [ref=f11e118]: Thu 08:15
              - generic [ref=f11e119]: On the shelf, still singing as it cools.
