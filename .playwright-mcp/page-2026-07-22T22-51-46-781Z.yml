      - generic [ref=f11e13]:
        - paragraph [ref=f11e14]: A sourdough bakery on Marlow Street
        - heading "Bread takes thirty-six hours. We won’t rush it." [level=1] [ref=f11e15]
        - paragraph [ref=f11e16]: Flour, water, salt, and a starter named Dot that is older than the bakery itself. Mixed Tuesday evening, baked before you wake, gone by early afternoon.
        - generic [ref=f11e17]:
          - generic [ref=f11e18]: Oven lit 5 a.m.
          - generic [ref=f11e19]: Doors 8:00–14:00
          - generic [ref=f11e20]: Tue · Thu · Sat
      - figure "The country loaf, twenty minutes out of the oven." [ref=f11e25]:
        - img "A crackled sourdough crust, close enough to count the blisters" [ref=f11e26]
    - generic [ref=f11e29]:
      - generic [ref=f11e30]:
        - heading "What’s on the shelf" [level=2] [ref=f11e31]
        - paragraph [ref=f11e32]: Five breads, no more. When the shelf is bare we close — usually around half past one, earlier on Saturdays.
      - list [ref=f11e33]:
        - listitem [ref=f11e34]:
          - generic [ref=f11e35]: Country sourdough
          - generic [ref=f11e36]: $9
          - paragraph [ref=f11e37]: The 36-hour loaf. Stone-milled wheat, a crackled umber crust, and a crumb that stays open until Thursday.
        - listitem [ref=f11e38]:
          - generic [ref=f11e39]: Seeded rye
          - generic [ref=f11e40]: $11
          - paragraph [ref=f11e41]: Sixty percent rye with sunflower, flax, and a molasses-dark edge. Dense on purpose; slice it thin.
        - listitem [ref=f11e42]:
          - generic [ref=f11e43]: Oat porridge loaf
          - generic [ref=f11e44]: $10
          - paragraph [ref=f11e45]: Rolled oats folded through the dough overnight. The soft one — built for toast and salted butter.
        - listitem [ref=f11e46]:
          - generic [ref=f11e47]: Walnut & raisin
          - generic [ref=f11e48]: $12
          - paragraph [ref=f11e49]: Toasted walnuts, raisins plumped in black tea. Cheese’s best friend, and ours.
        - listitem [ref=f11e50]:
          - generic [ref=f11e51]:
            - text: Fig & fennel
            - generic [ref=f11e52]: Saturday only
          - generic [ref=f11e53]: $13
          - paragraph [ref=f11e54]: One batch, sixty loaves, out by nine. We have never once made it to noon with any left.
    - generic [ref=f11e56]:
      - heading "Three bake days. That’s the whole promise." [level=2] [ref=f11e57]
      - paragraph [ref=f11e58]: We bake less than we could sell, on purpose. A small oven, two bakers, and bread that never sits overnight.
