    - generic [ref=f11e98]:
      - figure "Marta shapes every loaf by hand. The bench knows." [ref=f11e99]:
        - img "A baker's floured hands turning dough on the bench" [ref=f11e100]
      - generic [ref=f11e102]:
        - heading "Two days in every loaf" [level=2] [ref=f11e103]
        - paragraph [ref=f11e104]: Marta started Hearthstone in 2016 with a secondhand deck oven and a starter her grandmother kept alive through three apartments and one divorce.
        - generic [ref=f11e105]:
          - paragraph [ref=f11e106]: Nothing here is complicated, and nothing is quick. The schedule below hasn’t changed in nine years, because the bread hasn’t asked it to.
