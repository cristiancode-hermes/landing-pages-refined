- generic [active] [ref=f3e1]:
  - banner [ref=f3e2]:
    - generic:
      - heading "STATIC_BLOOM" [level=1]:
        - text: STATIC
        - emphasis: _
        - text: BLOOM
      - paragraph: A generative art collective. Nine members, one renderer, no saved states. Everything you see here was computed a moment ago and will never exist again.
      - paragraph: 52.5200°N 13.4050°E · EST. 2019 · SEED UNSTABLE
  - main [ref=f3e4]:
    - region [ref=f3e5]:
      - generic [ref=f3e6]:
        - heading "The rules we render by" [level=2] [ref=f3e7]
        - paragraph [ref=f3e8]: Static Bloom is a collective, not a studio. Nobody signs anything. The rules below are the entire contract — they were compiled in 2019 and have never thrown an exception.
        - list [ref=f3e9]:
          - listitem [ref=f3e10]:
            - generic [ref=f3e11]: RULE_01
            - paragraph [ref=f3e12]:
              - strong [ref=f3e13]: No saved states.
              - text: A work exists only while it renders. If you loved it, you loved a moment, not a file.
          - listitem [ref=f3e14]:
            - generic [ref=f3e15]: RULE_02
            - paragraph [ref=f3e16]:
              - strong [ref=f3e17]: The seed is public.
              - text: Every exhibited piece ships with its seed and commit hash. If you can recreate it, you collaborated.
          - listitem [ref=f3e18]:
            - generic [ref=f3e19]: RULE_03
            - paragraph [ref=f3e20]:
              - strong [ref=f3e21]: No neural networks.
              - text: Noise, fields, L-systems, feedback loops. If a GPU can dream it, we are not interested in its dreams.
          - listitem [ref=f3e22]:
            - generic [ref=f3e23]: RULE_04
            - paragraph [ref=f3e24]:
              - strong [ref=f3e25]: Phosphor over pigment.
              - text: We are a screen practice. Prints exist only to fund the electricity.
          - listitem [ref=f3e26]:
            - generic [ref=f3e27]: RULE_05
            - paragraph [ref=f3e28]:
              - strong [ref=f3e29]: Delete something at every meeting.
              - text: The codebase gets smaller or it gets forked. Both have happened.
    - region [ref=f3e30]:
