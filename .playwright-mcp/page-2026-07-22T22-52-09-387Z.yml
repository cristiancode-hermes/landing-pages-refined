        - paragraph [ref=f18e24]: EXPEDITION D-7 · CENTRAL ARCTIC BASIN · ON ICE
        - heading "Four hundred days adrift on purpose." [level=1] [ref=f18e25]: Four hundred daysadrift on purpose.
        - paragraph [ref=f18e26]: Driftlab is a research camp frozen into the pack ice, drifting with it, measuring everything the ocean and sky hand us. No engine noise. No fixed address. Just the floe, the instruments, and the log.
