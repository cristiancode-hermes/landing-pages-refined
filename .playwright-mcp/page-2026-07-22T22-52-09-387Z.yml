    - generic [ref=f18e66]:
      - heading "The legs" [level=2] [ref=f18e67]
      - paragraph [ref=f18e68]: D-7 runs thirteen months in four legs. Crews rotate by icebreaker; the floe does not. Dates are plan-of-record — the ice edits the plan, and we log the edits.
      - generic [ref=f18e69]:
        - generic [ref=f18e70]:
          - generic [ref=f18e71]: I
          - generic [ref=f18e72]: SEP — DEC 2025
          - generic [ref=f18e73]:
            - strong [ref=f18e74]: Freeze-in & baseline
            - text: Locate the floe, anchor the camp, drill the first core line. Polar night arrives mid-leg; instrument checkout by headlamp.
          - generic [ref=f18e75]: RV ARCTIC TERN
          - generic [ref=f18e76]: COMPLETE
        - generic [ref=f18e77]:
          - generic [ref=f18e78]: II
          - generic [ref=f18e79]: JAN — APR 2026
          - generic [ref=f18e80]:
            - strong [ref=f18e81]: Deep winter transect
            - text: "Ocean moorings serviced under 1.8 m of ice. Aurora optics run continuous. Coldest logged night so far: −38.9 °C, 11 February."
          - generic [ref=f18e82]: NO ROTATION · ICEBOUND
          - generic [ref=f18e83]: UNDERWAY
        - generic [ref=f18e84]:
          - generic [ref=f18e85]: III
          - generic [ref=f18e86]: MAY — AUG 2026
          - generic [ref=f18e87]:
            - strong [ref=f18e88]: Melt season
            - text: Melt-pond hydrology, under-ice light measurements, first open leads. The camp moves twice as the floe cracks. It always cracks.
          - generic [ref=f18e89]: KV SVALBARD
          - generic [ref=f18e90]: PLANNED
        - generic [ref=f18e91]:
          - generic [ref=f18e92]: IV
          - generic [ref=f18e93]: SEP — OCT 2026
          - generic [ref=f18e94]:
            - strong [ref=f18e95]: Recovery
            - text: Every sensor comes home or gets left running by design. Core archive flies south in −25 °C boxes. Camp struck; floe released.
          - generic [ref=f18e96]: RV ARCTIC TERN
          - generic [ref=f18e97]: PLANNED
    - generic [ref=f18e99]:
      - heading "The science program" [level=2] [ref=f18e100]
      - paragraph [ref=f18e101]: Three work packages, one floe. Everything is cross-referenced to the drift track so a water sample and a snow pit can be placed on the same map, hour for hour.
      - generic [ref=f18e102]:
        - article [ref=f18e103]:
          - paragraph [ref=f18e104]: WP-1 · GLACIOLOGY
          - heading "Ice core archive" [level=3] [ref=f18e105]
          - paragraph [ref=f18e106]: "A 200 m core line across the floe, read layer by layer back to the 1960s. Each core is split on site: half analyzed in the cold lab at −20 °C, half flown home untouched."
          - paragraph [ref=f18e107]: "CORES LOGGED TO DATE: 312 · OLDEST LAYER: 1964"
        - article [ref=f18e108]:
          - paragraph [ref=f18e109]: WP-2 · OCEANOGRAPHY
          - heading "Ocean moorings" [level=3] [ref=f18e110]
          - paragraph [ref=f18e111]: Four moorings hang beneath the floe to 800 m, listening for warm Atlantic water sneaking north under the ice. Serviced by divers in dry suits, because robots hate the cold more than we do.
          - paragraph [ref=f18e112]: "DEEPEST SENSOR: 812 M · WARMEST INTRUSION: +1.3 °C"
        - article [ref=f18e113]:
          - paragraph [ref=f18e114]: WP-3 · ATMOSPHERE
          - heading "Aurora optics" [level=3] [ref=f18e115]
          - paragraph [ref=f18e116]: Three all-sky cameras and a photometer run every dark hour of the polar night, pairing auroral displays with the camp's magnetometer. The sky talks; we transcribe.
          - paragraph [ref=f18e117]: "NIGHTS IMAGED: 121 · STRONGEST STORM: KP 7, 9 FEB"
    - generic [ref=f18e119]:
      - figure "FIG 02 — CORE D7-118, SECTION 3 · COLD LAB BENCH" [ref=f18e120]:
        - img "A meter-long ice core on the cold-lab bench, bands of trapped bubbles visible like tree rings under the inspection lamp." [ref=f18e121]
      - generic [ref=f18e123]:
        - heading "Read the ice, page by page." [level=2] [ref=f18e124]
        - paragraph [ref=f18e125]: Every winter the pack freezes a new layer; every summer it signs the margin. A core from this floe is a diary the ocean kept without being asked — ash from a Siberian fire season, the salt of a bad storm, the first spring melt spelled out in bubbles.
        - paragraph [ref=f18e126]: Driftlab exists because satellites see the ice from above and models guess at it from afar. Somebody has to stand on it and take its temperature. For thirteen months, that's us.
        - paragraph [ref=f18e127]: LOG, 11 FEB · 04:50 — −38.9 °C. GENERATOR 2 COMPLAINED, THEN DIDN'T. AURORA KP 7 OVERHEAD UNTIL DAWN. WORTH IT.
    - generic [ref=f18e129]:
      - heading "Winter with us." [level=2] [ref=f18e130]
      - paragraph [ref=f18e131]: Expedition D-8 embarks September 2027. We are hiring nine crew and four science staff for the full drift, plus two rotation-only positions on Legs I and III. Applications close 30 November 2026.
      - generic [ref=f18e132]:
        - generic [ref=f18e133]:
          - heading "Open berths" [level=3] [ref=f18e134]
          - list [ref=f18e135]:
            - listitem [ref=f18e136]: Ice pilot / floe safety lead — you decide where the camp sleeps
            - listitem [ref=f18e137]: Field engineer, power & comms — two generators, zero excuses
            - listitem [ref=f18e138]: Marine technician, moorings — dry-suit certified
            - listitem [ref=f18e139]: Cook & medic — one berth, two callings, non-negotiable
        - generic [ref=f18e140]:
          - heading "You should bring" [level=3] [ref=f18e141]
          - list [ref=f18e142]:
            - listitem [ref=f18e143]: One full polar season or equivalent cold remote work
            - listitem [ref=f18e144]: Calm at 03:00 when the ice alarm sounds
            - listitem [ref=f18e145]: Instrument discipline — the log is the product
            - listitem [ref=f18e146]: A book you're willing to lend. The camp library runs on trust
        - generic [ref=f18e147]:
          - heading "What we promise" [level=3] [ref=f18e148]
          - list [ref=f18e149]:
            - listitem [ref=f18e150]: 13 months, paid, incl. 60 days pre-deployment training
            - listitem [ref=f18e151]: Weekly sat uplink — 40 GB, voice prioritized
            - listitem [ref=f18e152]: Full medevac cover via Longyearbyen, weather permitting
            - listitem [ref=f18e153]: Your name on the data. Every dataset lists its collectors
      - generic [ref=f18e154]:
        - link "Apply for D-8" [ref=f18e155] [cursor=pointer]:
          - /url: mailto:crew@driftlab.example?subject=D-8%20application
        - paragraph [ref=f18e156]: Send a one-page field history and the harshest condition you've worked in, in °C. We read every application aloud at camp. Replies within 14 days, ice permitting.
