      - figure "Last dance, half past midnight No. 221" [ref=f20e39]:
        - button [ref=f20e40]:
          - img "A crowded dance floor at night, the couple at its centre, motion blur of raised glasses" [ref=f20e41]
        - generic [ref=f20e42]:
          - generic [ref=f20e43]: Last dance, half past midnight
