  - main [ref=f20e13]:
    - region "Introduction" [ref=f20e14]:
      - generic [ref=f20e15]: Wedding photography · est. 2011
      - heading "Photographs that outlive the day" [level=1] [ref=f20e16]
      - paragraph [ref=f20e17]: Fifteen years, two cameras, and a stubborn belief that the best frame of your wedding is the one you never saw being taken.
      - figure "Barn ceremony, Widbrook Grange, Wiltshire No. 214" [ref=f20e18]:
        - img "A ceremony in a stone barn, guests standing, late light falling across the aisle" [ref=f20e19]
        - generic [ref=f20e20]:
          - generic [ref=f20e21]: Barn ceremony, Widbrook Grange, Wiltshire
          - generic [ref=f20e22]: No. 214
    - region [ref=f20e23]:
      - generic [ref=f20e24]:
        - heading "The unposed philosophy" [level=2] [ref=f20e25]
        - paragraph [ref=f20e26]: I will not ask you to tilt your chin, laugh on cue, or walk toward me slowly while holding hands. You have waited years for this day; you should spend it with the people you invited, not performing for my lens.
        - paragraph [ref=f20e27]: Instead I work like a quiet guest who happens to hold a camera — close enough for the tear your grandmother hides, far enough that you forget I am there. Couples tell me afterwards they can't remember being photographed at all. That is the review I want.
        - paragraph [ref=f20e28]:
          - text: Eleanor Whitfield
          - generic [ref=f20e29]: Principal photographer — twenty weddings a year, never more
      - figure [ref=f20e30]:
        - img "A bride mid-laugh, veil caught by the wind, unaware of the camera" [ref=f20e31]
    - region "Selected frames" [ref=f20e32]:
      - figure "The details table No. 198" [ref=f20e33]:
        - button [ref=f20e34]:
