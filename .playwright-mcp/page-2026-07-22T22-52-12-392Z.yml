    - region [ref=f20e45]:
      - heading "Three collections, priced plainly" [level=2] [ref=f20e46]
      - paragraph [ref=f20e47]: No tiers designed to upsell you, no "investment" euphemisms. The price below is the price you pay, travel within England included.
      - list [ref=f20e48]:
        - listitem [ref=f20e49]:
          - heading "The Morning" [level=3] [ref=f20e50]
          - paragraph [ref=f20e51]: Four hours, ceremony to speeches. Suited to registry offices and small gatherings of under thirty guests. Around 350 finished photographs, delivered in three weeks.
          - paragraph [ref=f20e52]:
            - text: £1,950
            - generic [ref=f20e53]: deposit £400
          - paragraph [ref=f20e54]: Weekdays and winter Saturdays only — I keep summer weekends for full days.
        - listitem [ref=f20e55]:
          - heading "The Full Day" [level=3] [ref=f20e56]
          - paragraph [ref=f20e57]: Ten hours, preparations to the last dance I'll stay upright for. Around 700 finished photographs, a linen proof box within a month, and an engagement hour in spring so we know each other before the day.
          - paragraph [ref=f20e58]:
            - text: £3,400
            - generic [ref=f20e59]: deposit £600
          - paragraph [ref=f20e60]: The collection nine of ten couples choose, which is why it sits in the middle.
        - listitem [ref=f20e61]:
          - heading "The Long Weekend" [level=3] [ref=f20e62]
          - paragraph [ref=f20e63]: For weddings that span a welcome supper and a slow Sunday lunch. Two days of coverage, roughly 1,100 photographs, and a hand-bound album made in Somerset — the reason the studio is called Tintype.
          - paragraph [ref=f20e64]:
            - text: £6,800
            - generic [ref=f20e65]: deposit £1,200
          - paragraph [ref=f20e66]: Four weekends a year, booked on conversation rather than first-come.
      - paragraph [ref=f20e67]: Every couple receives the full-resolution files and the right to print them anywhere, forever. Watermarks are for stock libraries, not for your marriage.
    - region [ref=f20e68]:
      - generic [ref=f20e69]:
        - heading "Is your date still open?" [level=2] [ref=f20e70]
        - paragraph [ref=f20e71]: I take twenty weddings a year and the diary for 2027 is already a third full. Tell me the date and the venue; I will answer personally within two days, honestly, even if the answer is no.
