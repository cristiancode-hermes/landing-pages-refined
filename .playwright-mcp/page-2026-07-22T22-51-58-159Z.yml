          - definition [ref=f14e106]: 47 Mercer Lane, down the stairs, under the copper pipe sign
          - term [ref=f14e107]: Getting here
          - definition [ref=f14e108]: Broadway stop, two minutes on foot. No parking — don't try.
          - term [ref=f14e109]: Contact
          - definition [ref=f14e110]: No phone. No email list. The line is the reservation.
        - paragraph [ref=f14e111]: "Allergies: our broth contains pork and sesame in everything. Vegetarians, sincerely — we are not your restaurant, and we'd rather say so here than at the door."
