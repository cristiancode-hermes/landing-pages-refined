      - generic [ref=f14e25]:
        - heading "The broth decides when we close." [level=2] [ref=f14e26]
        - paragraph [ref=f14e27]: "Every morning at 5:00, Mariko starts the pot: pork femur, back fat, nothing else, at a rolling boil hard enough to emulsify the marrow into the water. Fourteen hours later it turns the color of light through a whiskey glass. That's the whole recipe. There is no backup batch."
        - paragraph [ref=f14e28]: Most nights the pot holds about ninety bowls. Fridays it can run to a hundred and ten. When the ladle scrapes bottom we hang the wooden sign, bow to whoever's still in line, and start again tomorrow. We'd rather disappoint you at the door than dilute a bowl.
