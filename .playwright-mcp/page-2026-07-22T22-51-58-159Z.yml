    - generic [ref=f14e50]:
      - generic [ref=f14e51]:
        - heading "Four bowls. That's the menu." [level=2] [ref=f14e52]
        - paragraph [ref=f14e53]: Everything is built on the same 14-hour tonkotsu. Noodles are pulled to order — never before you sit down.
      - generic [ref=f14e54]:
        - article [ref=f14e55]:
          - generic [ref=f14e56]:
            - heading "The Classic" [level=3] [ref=f14e57]
            - generic [ref=f14e58]: $18
          - paragraph [ref=f14e59]: Tonkotsu, thin straight noodles, two slices of chashu, nori, scallion, black garlic oil. The bowl we opened with in 2016, unchanged since.
          - generic [ref=f14e60]: The one to start with
        - article [ref=f14e61]:
          - generic [ref=f14e62]:
            - heading "Shoyu Kettle" [level=3] [ref=f14e63]
            - generic [ref=f14e64]: $17
          - paragraph [ref=f14e65]: The same broth cut with a three-year aged shoyu tare. Lighter on the palate, heavier on the aroma. Bamboo shoots, no egg.
          - generic [ref=f14e66]: Clearer, sharper
        - article [ref=f14e67]:
          - generic [ref=f14e68]:
            - heading "Red Miso" [level=3] [ref=f14e69]
            - generic [ref=f14e70]: $18
          - paragraph [ref=f14e71]: Sendai red miso whisked into the bowl, chili-sesame crumble, sweet corn, a knob of butter that melts as you eat. Winter's answer to everything.
          - generic [ref=f14e72]: Rich, warming
        - article [ref=f14e73]:
          - generic [ref=f14e74]:
            - heading "Tsukemen" [level=3] [ref=f14e75]
            - generic [ref=f14e76]: $19
          - paragraph [ref=f14e77]: Thick noodles served cold beside a concentrated dipping broth, reduced by half. Ask for the soup-wari at the end — we cut the dip with hot broth so nothing goes to waste.
          - generic [ref=f14e78]: Dip, don't slurp
      - paragraph [ref=f14e79]: Kaedama (extra noodle ball) $3 · ajitama egg $2 · chashu plate $6 · house chili oil to take home, $9 the jar.
    - generic [ref=f14e81]:
      - figure [ref=f14e82]:
        - img "Eighteen wooden stools along a single cypress counter, steam rising from the open kitchen behind it" [ref=f14e83]
      - generic [ref=f14e84]:
        - heading "Eighteen stools, one counter, zero table service." [level=2] [ref=f14e85]
        - paragraph [ref=f14e86]: You'll queue, you'll sit elbow to elbow with a stranger, and you'll probably leave with a new favorite person. The counter is cypress, the stools wobble slightly, and the ticket is cash or card but never an app.
        - list [ref=f14e87]:
          - listitem [ref=f14e88]: "Line etiquette: hold your spot in person — no placeholders, no holding six seats for friends who are \"five minutes away.\""
          - listitem [ref=f14e89]: Solo diners almost always get in within twenty minutes. Parties of four or more should expect to split.
          - listitem [ref=f14e90]: Eat, then go. We love you, but someone behind you is cold. Lingering is for the bar two doors down.
