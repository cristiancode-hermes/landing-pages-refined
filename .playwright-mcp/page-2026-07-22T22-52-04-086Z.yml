        - generic [ref=f16e16]: Lockhart, Texas · since 1998
        - heading "LOW. SLOW. GONE." [level=1] [ref=f16e17]
        - paragraph [ref=f16e18]: Post oak, salt, pepper, and fourteen hours of paying attention. We open at eleven and sell meat by the half-pound until the board's erased — most days that's by two.
        - generic [ref=f16e19]:
          - link "See today's board" [ref=f16e20] [cursor=pointer]:
            - /url: "#board"
          - link "Line etiquette" [ref=f16e21] [cursor=pointer]:
            - /url: "#line"
        - figure [ref=f16e22]:
          - img "A sliced brisket with a black pepper crust and a smoke ring pink as sunrise, resting on butcher paper." [ref=f16e23]
        - paragraph [ref=f16e24]: Thursday's prime brisket, sliced to order. The flat never sees a knife till you do.
    - region "Today's meat board" [ref=f16e25]:
      - generic [ref=f16e26]:
        - generic [ref=f16e27]:
          - generic [ref=f16e28]: SOLD OUT
          - heading "The Board" [level=2] [ref=f16e29]
          - paragraph [ref=f16e30]: Everything's priced by the half-pound and weighed in front of you. When an item's gone, we strike it and that's that — we don't rush a second fire for anybody.
        - list [ref=f16e31]:
          - listitem [ref=f16e32]:
