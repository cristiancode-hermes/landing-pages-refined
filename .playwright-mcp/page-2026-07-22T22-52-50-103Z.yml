        - heading "No Zoom booths after six." [level=3] [ref=f1e148]
        - paragraph [ref=f1e149]: "Calls are fine all day — that is what the booths are for. But at 18:00 the floor switches to evening mode: no calls in the open, music stays low, and the long tables become what they were built for. People eat together, play chess, finish side projects. The rule is the reason residents stay an average of 3.2 years."
