- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic:
      - heading "STATIC_BLOOM" [level=1]:
        - text: STATIC
        - emphasis: _
        - text: BLOOM
      - paragraph: A generative art collective. Nine members, one renderer, no saved states. Everything you see here was computed a moment ago and will never exist again.
      - paragraph: 52.5200°N 13.4050°E · EST. 2019 · SEED UNSTABLE
  - main [ref=e4]:
    - region [ref=e5]:
      - generic [ref=e6]:
        - heading "The rules we render by" [level=2] [ref=e7]
        - paragraph [ref=e8]: Static Bloom is a collective, not a studio. Nobody signs anything. The rules below are the entire contract — they were compiled in 2019 and have never thrown an exception.
        - list [ref=e9]:
          - listitem [ref=e10]:
            - generic [ref=e11]: RULE_01
            - paragraph [ref=e12]:
              - strong [ref=e13]: No saved states.
              - text: A work exists only while it renders. If you loved it, you loved a moment, not a file.
          - listitem [ref=e14]:
            - generic [ref=e15]: RULE_02
            - paragraph [ref=e16]:
              - strong [ref=e17]: The seed is public.
              - text: Every exhibited piece ships with its seed and commit hash. If you can recreate it, you collaborated.
          - listitem [ref=e18]:
            - generic [ref=e19]: RULE_03
            - paragraph [ref=e20]:
              - strong [ref=e21]: No neural networks.
              - text: Noise, fields, L-systems, feedback loops. If a GPU can dream it, we are not interested in its dreams.
          - listitem [ref=e22]:
            - generic [ref=e23]: RULE_04
            - paragraph [ref=e24]:
              - strong [ref=e25]: Phosphor over pigment.
              - text: We are a screen practice. Prints exist only to fund the electricity.
          - listitem [ref=e26]:
            - generic [ref=e27]: RULE_05
            - paragraph [ref=e28]:
              - strong [ref=e29]: Delete something at every meeting.
              - text: The codebase gets smaller or it gets forked. Both have happened.
