          - paragraph [ref=f9e117]: "Five 2 ml vials: the three fragrances, plus two working sketches that have never shipped. Wear each for a week. Keep the ones you love; the €28 is credited in full against any bottle, whenever you are ready — there is no expiry on the credit."
          - paragraph [ref=f9e118]: €28, postage included in the EU. Ships every Tuesday from Grasse.
        - generic [ref=f9e119]:
          - heading "The refill program" [level=3] [ref=f9e120]
          - paragraph [ref=f9e121]: Opaline bottles are heavy cut glass, made to be kept. Bring yours to the boutique on rue des Orangers, or post it back in the original box, and we refill it for roughly 30% less than a new bottle. The cap and collar are replaced free if they ever wear.
          - paragraph [ref=f9e122]: "Refills since 2003: 14,206 bottles saved from the bin — and counting."
