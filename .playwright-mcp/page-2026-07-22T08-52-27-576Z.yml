        - paragraph [ref=f9e17]: Maison de parfum · Grasse, since 1987
        - heading "The air remembers what the eye forgets." [level=1] [ref=f9e18]
        - paragraph [ref=f9e19]: Opaline composes three perfumes a decade, no more. Each begins as a walk through the hills above Grasse and ends, years later, as a bottle we are willing to sign. We would rather you smell before you buy — which is why the library of vials comes first, always.
