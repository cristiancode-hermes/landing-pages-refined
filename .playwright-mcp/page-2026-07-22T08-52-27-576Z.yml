        - heading "Three fragrances, built note by note" [level=2] [ref=f9e30]
        - paragraph [ref=f9e31]: A perfume is a pyramid that collapses beautifully — the bright head burns off in minutes, the heart carries the afternoon, the base is what your scarf remembers in January. Each pyramid below builds the way the scent does.
