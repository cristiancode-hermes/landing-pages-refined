      - generic [ref=f9e103]:
        - heading "The nose" [level=2] [ref=f9e104]
        - paragraph [ref=f9e105]: "Maëlle Varenne was born in Grasse in 1963, in an apartment above a jasmine processor. She trained at ISIPCA, spent nine years composing for houses she is contractually forbidden to name, and came home in 1987 to found Opaline with one rule: nothing ships until she would wear it herself for a year."
        - paragraph [ref=f9e106]: She still smells every batch. The house releases nothing on a schedule — Figuier de Minuit took seven years, Pluie d'Opale eleven, Or Fumé four. A fourth fragrance has been "almost ready" since 2019. She is in no hurry, and neither are we.
        - blockquote [ref=f9e107]: “A perfume is finished when removing anything makes it worse, not when adding something makes it better.”
        - paragraph [ref=f9e108]: — Maëlle Varenne, in conversation with the house journal, 2021
    - generic [ref=f9e110]:
      - generic [ref=f9e111]:
        - heading "Smell first. Buy slowly. Refill forever." [level=2] [ref=f9e112]
        - paragraph [ref=f9e113]: Nobody should spend €140 on a description. The house exists to be worn, not admired from a counter.
      - generic [ref=f9e114]:
