          - heading "Figuier de Minuit" [level=3] [ref=f9e35]
          - paragraph [ref=f9e36]: The fig tree after dark, when the leaves stop giving green and start giving milk. Maëlle spent four summers on the fig accord alone; the finished scent opens cool and bitter, then sinks into something almost edible.
