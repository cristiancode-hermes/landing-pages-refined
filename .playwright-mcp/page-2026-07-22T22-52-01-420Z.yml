        - heading "This month's three" [level=2] [ref=f15e28]
        - paragraph [ref=f15e29]: Each pot is weighed, timed, and poured at the table. Water is filtered and held at temperature — never reboiled.
        - generic [ref=f15e30]:
          - heading "First Flush Darjeeling" [level=3] [ref=f15e31]
          - paragraph [ref=f15e32]: 2 min 30 · 85°C · $9
          - paragraph [ref=f15e33]: Gopaldhara estate, picked the second week of March. Muscatel and green almond; a cup that tastes like the altitude it grew at.
        - generic [ref=f15e34]:
          - heading "Alishan High Mountain Oolong" [level=3] [ref=f15e35]
          - paragraph [ref=f15e36]: 3 min · 92°C · $11
          - paragraph [ref=f15e37]: Rolled by hand at 1,400 metres in Chiayi County. Lilac, warm milk, a long mineral finish. Good for three infusions, better for four.
        - generic [ref=f15e38]:
          - heading "Smoked Lapsang, Unsmoked Heart" [level=3] [ref=f15e39]
          - paragraph [ref=f15e40]: 2 min · 90°C · $8
          - paragraph [ref=f15e41]: A Wuyi lapsang dried over fruitwood instead of pine — longan and dried plum first, the smoke arriving quietly at the end.
