                        - paragraph [ref=f97e92]: Our shop is the low door beneath the chapter house, down eleven worn steps. Bring a stout bag and a soft voice; the door is low for a reason, and the reason is humility.
                        - paragraph [ref=f97e93]: We sell bottles, wooden tokens for the winter market, and a small pamphlet of brewing psalms. We do not sell glasses, for drinking from the bottle builds character.
