                      - heading "Ninety seconds in the fire." [level=1] [ref=f94e18]
                      - paragraph [ref=f94e19]: Forty-eight hours of cold ferment, five hundred degrees of Oregon white oak, and a minute and a half you can taste. That's the whole trick. There is no other trick.
                      - generic [ref=f94e20]:
                        - link "Book a table" [ref=f94e21] [cursor=pointer]:
                          - /url: "#reserve"
                        - link "See the menu" [ref=f94e22] [cursor=pointer]:
                          - /url: "#menu"
                      - complementary [ref=f94e23]:
                        - strong [ref=f94e24]: 485 °C
                        - text: The oven runs white oak only, lit every morning at 7. By dinner the stone holds heat like a memory.
                  - region [ref=f94e25]:
                    - generic [ref=f94e26]:
                      - generic [ref=f94e27]:
                        - heading [level=2] [ref=f94e28]:
                          - text: Dough is a patient thing.
                          - emphasis [ref=f94e29]: We don't rush it.
                        - paragraph [ref=f94e30]: Every ball of dough at Ember & Oak starts two days before you sit down. Caputo flour, water, sea salt, a whisper of starter — then forty-eight hours cold, slow, and undisturbed in the basement. It comes up to room temperature at noon and meets the fire at five.
                        - paragraph [ref=f94e31]: What lands on your table is leopard-spotted, soft in the middle, crisp at the rim — the way a pizza behaves when the oven is hot enough to be a little scary.
                        - list [ref=f94e32]:
                          - listitem [ref=f94e33]: 48-hour cold ferment
                          - listitem [ref=f94e34]: Oregon white oak
                          - listitem [ref=f94e35]: 90-second bake
                          - listitem [ref=f94e36]: Fior di latte, made daily
                      - figure "The morning stretch — dough comes up from the cellar at noon sharp." [ref=f94e37]:
                        - img "Hands stretching a ball of forty-eight-hour dough on the flour-dusted oak bench" [ref=f94e38]
                  - region [ref=f94e40]:
                    - generic [ref=f94e41]:
                      - generic [ref=f94e42]:
                        - heading "The menu, short on purpose" [level=2] [ref=f94e43]
                        - paragraph [ref=f94e44]: Six pizzas, one oven, no substitutions on the margherita — we tried it your way in 2016 and we're still sorry.
                      - list [ref=f94e45]:
                        - listitem [ref=f94e46]:
                          - generic [ref=f94e47]:
                            - text: Margherita
                            - generic [ref=f94e48]: the benchmark
                          - generic [ref=f94e49]: San Marzano tomato, fior di latte pulled this morning, basil from the planter box out front, cold-pressed olive oil.
                          - generic [ref=f94e50]: $14
                        - listitem [ref=f94e51]:
                          - generic [ref=f94e52]: Marinara
                          - generic [ref=f94e53]: No cheese, no apology. Tomato, garlic confit, oregano, and the oven doing all the talking. Vegan as it stands.
                          - generic [ref=f94e54]: $13
                        - listitem [ref=f94e55]:
                          - generic [ref=f94e56]: Funghi
                          - generic [ref=f94e57]: Roasted maitake and cremini, taleggio, thyme, a little truffle oil — applied after the bake, where it belongs.
                          - generic [ref=f94e58]: $17
                        - listitem [ref=f94e59]:
                          - generic [ref=f94e60]:
                            - text: Diavola
                            - generic [ref=f94e61]: brings heat
                          - generic [ref=f94e62]: Spicy soppressata, Calabrian chili honey, smoked mozzarella. The honey goes on last and it matters.
                          - generic [ref=f94e63]: $18
                        - listitem [ref=f94e64]:
                          - generic [ref=f94e65]: Mortadella e Pistacchio
                          - generic [ref=f94e66]: Bianca base, mortadella laid on after the fire, crushed Sicilian pistachios, lemon zest, stracciatella.
                          - generic [ref=f94e67]: $19
                        - listitem [ref=f94e68]:
                          - generic [ref=f94e69]: Bianca
                          - generic [ref=f94e70]: Fior di latte, ricotta, garlic, rosemary, pecorino. Order it with a side of the chili honey and thank us later.
                          - generic [ref=f94e71]: $16
                      - paragraph [ref=f94e72]: Gluten-free dough is made in-house on Mondays — ask your server. Everything cuts into eight slices unless you say otherwise.
                  - region [ref=f94e73]:
                    - generic [ref=f94e74]:
                      - figure "Forty seats, one long oak table, and the oven doing its impression of a fireplace." [ref=f94e75]:
                        - img "The dining room at Ember & Oak at seven in the evening, oak tables lit by the oven's glow" [ref=f94e76]
                      - generic [ref=f94e78]:
                        - heading "Forty seats, one long table" [level=2] [ref=f94e79]
                        - paragraph [ref=f94e80]: The room is small on purpose. There's the communal oak table down the middle — reclaimed from a barn outside Salem — a handful of two-tops along the window, and four stools at the oven counter where you can watch your dinner blister.
                        - paragraph [ref=f94e81]: We keep a short list of natural wines and three local beers on tap. The soundtrack is whatever the kitchen is arguing about. Fridays, it's usually funk.
                  - region [ref=f94e82]:
                    - generic [ref=f94e83]:
                      - generic [ref=f94e84]:
                        - heading "When the fire's lit" [level=2] [ref=f94e85]
                        - paragraph [ref=f94e86]: We bake until the dough runs out — some Fridays that's 9:40, some it's midnight. If the oak is stacked by the door, we're open. Walk-ins always welcome at the oven counter.
