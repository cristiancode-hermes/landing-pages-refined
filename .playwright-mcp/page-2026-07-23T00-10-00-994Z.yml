                    - heading "Plainchant" [level=1] [ref=f97e23]
                    - paragraph [ref=f97e24]: Ale brewed under a vow of silence. The monks do the talking through the glass.
                - main [ref=f97e27]:
                  - blockquote [ref=f97e30]:
                    - text: “We have kept the same recipe since 1187. We considered changing it once, in 1493, and the brother who suggested it was asked to weed the turnips for a year.”
                    - generic [ref=f97e31]: — Brother Anselm, Cellarer
                  - figure "The north cellar, where the ales are aged and the novices are hushed." [ref=f97e32]:
                    - img "Oak barrels resting in the cool dark of the abbey cellar" [ref=f97e33]
                  - region [ref=f97e35]:
                    - generic [ref=f97e36]:
                      - generic [ref=f97e37]:
                        - heading "Three Ales, Brewed by the Hours" [level=2] [ref=f97e38]
                        - paragraph [ref=f97e39]: Each ale is named for the office at which it is racked. We brew what the barley allows and the abbot permits, in that order.
                      - article [ref=f97e40]:
                        - generic [ref=f97e41]:
                          - heading "Mattins" [level=3] [ref=f97e42]
                          - generic [ref=f97e43]: TABLE ALE · 3.4%
                        - paragraph [ref=f97e44]:
                          - text: Brewed for the long workday. Crust of brown bread, a whisper of honey, and a finish as brief as a good sermon.
                          - emphasis [ref=f97e45]: Pairs with ploughman's lunches, tailors' lunches, and lunches generally.
                        - generic [ref=f97e46]: £5.20 / 750ml
                      - article [ref=f97e47]:
                        - generic [ref=f97e48]:
                          - heading "Vigils" [level=3] [ref=f97e49]
                          - generic [ref=f97e50]: DARK MILD · 4.6%
                        - paragraph [ref=f97e51]:
                          - text: For the hour after midnight. Toasted hazelnut, dried fig, and the particular quiet of a chapel with one candle lit.
                          - emphasis [ref=f97e52]: Best taken slowly, in wool, near a fire that someone else is tending.
                        - generic [ref=f97e53]: £6.40 / 750ml
                      - article [ref=f97e54]:
                        - generic [ref=f97e55]:
                          - heading "Compline" [level=3] [ref=f97e56]
                          - generic [ref=f97e57]: BARLEYWINE · 9.1%
                        - paragraph [ref=f97e58]:
                          - text: The last office of the day, and the last word of the evening. Toffee, orange peel, old oak, and a warmth that lingers like incense.
                          - emphasis [ref=f97e59]: One bottle is an evening. Two is a confession.
                        - generic [ref=f97e60]: £9.80 / 750ml
                  - blockquote [ref=f97e63]:
                    - text: “Ora et labora. Pray and work. The brewing counts as both, which is why the brothers are so cheerful and so tired.”
                    - generic [ref=f97e64]: — The Abbot, on being asked about output targets
                  - region [ref=f97e65]:
                    - generic [ref=f97e66]:
                      - generic [ref=f97e67]:
                        - heading "The Rule of the Brewery" [level=2] [ref=f97e68]
                        - paragraph [ref=f97e69]: Chapter nine of the house rule concerns the brewhouse. It is read aloud each Brewsday. Extracts follow.
                      - generic [ref=f97e70]:
                        - generic [ref=f97e71]:
                          - heading "Rule the First" [level=3] [ref=f97e72]
                          - paragraph [ref=f97e73]: The kettle shall be scraped, for residue is pride, and pride is off-flavours.
                        - generic [ref=f97e74]:
                          - heading "Rule the Second" [level=3] [ref=f97e75]
                          - paragraph [ref=f97e76]: Silence is kept from mashing-in until the wort is cooled. Humming is permitted. Whistling is not, for it frightens the yeast.
                        - generic [ref=f97e77]:
                          - heading "Rule the Third" [level=3] [ref=f97e78]
                          - paragraph [ref=f97e79]: No brother shall taste from the conditioning cask before the appointed day, however persuasive his thirst. Brother Martin.
                        - generic [ref=f97e80]:
                          - heading "Rule the Fourth" [level=3] [ref=f97e81]
                          - paragraph [ref=f97e82]: When the barley is poor, give thanks; when the barley is good, give more thanks and write down what you did.
                        - generic [ref=f97e83]:
                          - heading "Rule the Fifth" [level=3] [ref=f97e84]
                          - paragraph [ref=f97e85]: The first bottle of every batch goes to the chapel roof fund. The roof has been leaking since 1342 and will continue to do so, but the gesture is the thing.
