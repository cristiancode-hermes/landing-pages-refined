    - generic [ref=f22e60]:
      - generic [ref=f22e61]:
        - heading "Forty vendors, no repeats, no mercy" [level=2] [ref=f22e62]
        - paragraph [ref=f22e63]: Every stall is chosen by people who queue. Here are three the regulars plan their night around — the other thirty-seven you'll have to discover the hard way, which is the fun way.
      - generic [ref=f22e64]:
        - article [ref=f22e65]:
          - img "A stall grill loaded with lacquered skewers over open flame, smoke rising into lantern light" [ref=f22e66]
          - generic [ref=f22e67]:
            - heading "Char Kings" [level=3] [ref=f22e68]
            - paragraph [ref=f22e69]: Pork collar skewers brushed with burnt honey, finished over binchotan. The line forms at 6:04. They sell out by ten — every single week.
            - generic [ref=f22e70]: Stall 04 · Grill Row
        - article [ref=f22e71]:
          - img "Steam pouring off bamboo baskets as a vendor lifts the lid on fresh dumplings" [ref=f22e72]
          - generic [ref=f22e73]:
            - heading "The Dumpling Aunties" [level=3] [ref=f22e74]
            - paragraph [ref=f22e75]: Two sisters, one folding table, four hundred pleats an hour. Pork-and-chive is the classic; the black vinegar is not optional.
            - generic [ref=f22e76]: Stall 11 · Noodle Alley
        - article [ref=f22e77]:
          - img "Crowd bokeh and strings of lights above packed market tables late in the evening" [ref=f22e78]
          - generic [ref=f22e79]:
            - heading "Mango Sticky" [level=3] [ref=f22e80]
            - paragraph [ref=f22e81]: Coconut rice pressed to order, mango cut in front of you, sesame salt on top. Eat it on the curb watching the crowd go by — that's the whole point.
            - generic [ref=f22e82]: Stall 27 · Sweet Corner
      - paragraph [ref=f22e83]:
        - strong [ref=f22e84]: Full vendor list posted at both gates
        - text: — plus rotating guest stalls each week, so the map you memorized in June is wrong by August.
    - generic [ref=f22e86]:
      - generic [ref=f22e87]:
        - heading "The grounds, five zones, two gates" [level=2] [ref=f22e88]
        - paragraph [ref=f22e89]: Pratt Street between Meridian and the old rail arch. Cash and cards everywhere; the beer tent is card only. Lost? Follow the smoke.
