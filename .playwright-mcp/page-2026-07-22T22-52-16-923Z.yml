      - paragraph [ref=f22e18]: Every Friday · June 6 – August 29 · 6pm until the coals give out
      - heading [level=1] [ref=f22e19]:
        - text: Forty stalls. One alley.
        - emphasis [ref=f22e20]: Eat everything.
      - paragraph [ref=f22e21]: Pratt Street closes at five, the lanterns go up at six, and by seven the whole block smells like charcoal, lemongrass, and brown sugar. This is the Night Market — twelve Fridays of skewers, noodles, cold beer, and loud music.
