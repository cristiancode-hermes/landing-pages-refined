          - paragraph [ref=f26e113]: "Sonder is built offline-first, because the entries that matter most happen on night buses, mountain passes and ferry decks. Here's the honest version of what that means:"
          - list [ref=f26e114]:
            - listitem [ref=f26e115]:
              - generic [ref=f26e116]:
                - strong [ref=f26e117]: Your journal lives on your device.
                - text: Every word is written to local storage first. Airplane mode changes nothing.
            - listitem [ref=f26e118]:
              - generic [ref=f26e119]:
                - strong [ref=f26e120]: Sync happens when you say so.
                - text: When you're back on Wi-Fi, entries sync to your account. Conflicts keep both versions — we never silently overwrite.
            - listitem [ref=f26e121]:
              - generic [ref=f26e122]:
                - strong [ref=f26e123]: Export is forever, in plain Markdown.
                - text: Leave tomorrow and take every entry, photo caption and pinned place with you. No ransom, no lock-in.
