            - generic [ref=f26e47]: 14 MAR 2024
            - heading "Lisbon, the wrong tram" [level=3] [ref=f26e48]
            - paragraph [ref=f26e49]: "Took the 28 in the wrong direction on purpose after the second stop. An old woman named Inês told me which bakery her sister swears by and then argued with the driver about it. Pastel de nata count: four. Regrets: none."
            - generic [ref=f26e50]:
              - generic [ref=f26e51]: Rua Augusta, 18:42
              - generic [ref=f26e52]: 612 words
          - article [ref=f26e53]:
            - generic [ref=f26e54]: 22 JUN 2024
            - heading "Night train to Kandy" [level=3] [ref=f26e55]
            - paragraph [ref=f26e56]: No signal since Colombo and honestly? Good. The man across the aisle shared his roasted chickpeas and taught me the Sinhala word for rain. Wrote three pages by window light while the highlands went past black and enormous.
            - generic [ref=f26e57]:
              - generic [ref=f26e58]: Somewhere past Rambukkana
              - generic [ref=f26e59]: Written offline
          - article [ref=f26e60]:
            - generic [ref=f26e61]: 02 NOV 2025
            - heading "Kyoto, last morning" [level=3] [ref=f26e62]
            - paragraph [ref=f26e63]: Got lost in Nishiki Market before it opened and watched the knife man sharpen for twenty minutes. Bought nothing. He bowed anyway. Some entries you write so the feeling has somewhere to live.
