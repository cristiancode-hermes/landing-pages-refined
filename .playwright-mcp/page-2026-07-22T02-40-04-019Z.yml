        - generic [ref=f1e78]:
          - heading "Forty seats, one long table" [level=2] [ref=f1e79]
          - paragraph [ref=f1e80]: The room is small on purpose. There's the communal oak table down the middle — reclaimed from a barn outside Salem — a handful of two-tops along the window, and four stools at the oven counter where you can watch your dinner blister.
          - paragraph [ref=f1e81]: We keep a short list of natural wines and three local beers on tap. The soundtrack is whatever the kitchen is arguing about. Fridays, it's usually funk.
    - region [ref=f1e82]:
