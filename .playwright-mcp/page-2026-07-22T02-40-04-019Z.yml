          - strong [ref=f1e24]: 485 °C
          - text: The oven runs white oak only, lit every morning at 7. By dinner the stone holds heat like a memory.
    - region [ref=f1e25]:
      - generic [ref=f1e26]:
        - generic [ref=f1e27]:
          - heading [level=2] [ref=f1e28]:
            - text: Dough is a patient thing.
            - emphasis [ref=f1e29]: We don't rush it.
          - paragraph [ref=f1e30]: Every ball of dough at Ember & Oak starts two days before you sit down. Caputo flour, water, sea salt, a whisper of starter — then forty-eight hours cold, slow, and undisturbed in the basement. It comes up to room temperature at noon and meets the fire at five.
          - paragraph [ref=f1e31]: What lands on your table is leopard-spotted, soft in the middle, crisp at the rim — the way a pizza behaves when the oven is hot enough to be a little scary.
          - list [ref=f1e32]:
            - listitem [ref=f1e33]: 48-hour cold ferment
            - listitem [ref=f1e34]: Oregon white oak
            - listitem [ref=f1e35]: 90-second bake
            - listitem [ref=f1e36]: Fior di latte, made daily
        - figure "The morning stretch — dough comes up from the cellar at noon sharp." [ref=f1e37]:
          - img "Hands stretching a ball of forty-eight-hour dough on the flour-dusted oak bench" [ref=f1e38]
    - region [ref=f1e40]:
      - generic [ref=f1e41]:
        - generic [ref=f1e42]:
          - heading "The menu, short on purpose" [level=2] [ref=f1e43]
          - paragraph [ref=f1e44]: Six pizzas, one oven, no substitutions on the margherita — we tried it your way in 2016 and we're still sorry.
        - list [ref=f1e45]:
          - listitem [ref=f1e46]:
            - generic [ref=f1e47]:
              - text: Margherita
              - generic [ref=f1e48]: the benchmark
            - generic [ref=f1e49]: San Marzano tomato, fior di latte pulled this morning, basil from the planter box out front, cold-pressed olive oil.
            - generic [ref=f1e50]: $14
          - listitem [ref=f1e51]:
            - generic [ref=f1e52]: Marinara
            - generic [ref=f1e53]: No cheese, no apology. Tomato, garlic confit, oregano, and the oven doing all the talking. Vegan as it stands.
            - generic [ref=f1e54]: $13
          - listitem [ref=f1e55]:
            - generic [ref=f1e56]: Funghi
            - generic [ref=f1e57]: Roasted maitake and cremini, taleggio, thyme, a little truffle oil — applied after the bake, where it belongs.
            - generic [ref=f1e58]: $17
          - listitem [ref=f1e59]:
            - generic [ref=f1e60]:
              - text: Diavola
              - generic [ref=f1e61]: brings heat
            - generic [ref=f1e62]: Spicy soppressata, Calabrian chili honey, smoked mozzarella. The honey goes on last and it matters.
            - generic [ref=f1e63]: $18
          - listitem [ref=f1e64]:
            - generic [ref=f1e65]: Mortadella e Pistacchio
            - generic [ref=f1e66]: Bianca base, mortadella laid on after the fire, crushed Sicilian pistachios, lemon zest, stracciatella.
            - generic [ref=f1e67]: $19
          - listitem [ref=f1e68]:
            - generic [ref=f1e69]: Bianca
            - generic [ref=f1e70]: Fior di latte, ricotta, garlic, rosemary, pecorino. Order it with a side of the chili honey and thank us later.
            - generic [ref=f1e71]: $16
        - paragraph [ref=f1e72]: Gluten-free dough is made in-house on Mondays — ask your server. Everything cuts into eight slices unless you say otherwise.
    - region [ref=f1e73]:
      - generic [ref=f1e74]:
