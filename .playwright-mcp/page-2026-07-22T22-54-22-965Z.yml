          - heading "The ritual of the hour" [level=2] [ref=e41]
          - paragraph [ref=e42]: In Milan the aperitivo is not a drink, it's an appointment. The piazza fills, the light goes long and orange, and the first spritz arrives with a little plate of something salty. We made Vermouth Hours for that exact window — and wrote its schedule on the label, because rituals deserve timetables.
