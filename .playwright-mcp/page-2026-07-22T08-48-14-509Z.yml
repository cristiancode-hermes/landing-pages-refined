        - heading "Ninety seconds in the fire." [level=1] [ref=f3e18]
        - paragraph [ref=f3e19]: Forty-eight hours of cold ferment, five hundred degrees of Oregon white oak, and a minute and a half you can taste. That's the whole trick. There is no other trick.
