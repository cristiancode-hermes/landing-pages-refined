          - generic [ref=e32]: Country sourdough
          - generic [ref=e33]: $9
          - paragraph [ref=e34]: The 36-hour loaf. Stone-milled wheat, a crackled umber crust, and a crumb that stays open until Thursday.
        - listitem [ref=e35]:
          - generic [ref=e36]: Seeded rye
          - generic [ref=e37]: $11
          - paragraph [ref=e38]: Sixty percent rye with sunflower, flax, and a molasses-dark edge. Dense on purpose; slice it thin.
        - listitem [ref=e39]:
          - generic [ref=e40]: Oat porridge loaf
          - generic [ref=e41]: $10
          - paragraph [ref=e42]: Rolled oats folded through the dough overnight. The soft one — built for toast and salted butter.
        - listitem [ref=e43]:
          - generic [ref=e44]: Walnut & raisin
          - generic [ref=e45]: $12
          - paragraph [ref=e46]: Toasted walnuts, raisins plumped in black tea. Cheese’s best friend, and ours.
        - listitem [ref=e47]:
