        - heading "Bread takes thirty-six hours. We won’t rush it." [level=1] [ref=e12]
        - paragraph [ref=e13]: Flour, water, salt, and a starter named Dot that is older than the bakery itself. Mixed Tuesday evening, baked before you wake, gone by early afternoon.
