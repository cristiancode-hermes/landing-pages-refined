    - region "The pit and the pitmaster" [ref=e53]:
      - generic [ref=e54]:
        - heading "The Pit Never Lies" [level=2] [ref=e55]
        - generic [ref=e56]:
          - figure [ref=e57]:
            - img "Oak coals glowing deep orange inside the mouth of the offset pit at four in the morning." [ref=e58]
          - generic [ref=e59]:
            - paragraph [ref=e60]: Marla "Two-Alarm" Reyes has minded the same 1,000-gallon offset since 1998. She stokes the first coals at 4 a.m., reads the smoke by color — thin and blue or nothing — and won't let anybody else wrap the briskets. The paper's pink, the twine's cotton, and that's the whole recipe.
            - paragraph [ref=e61]: We burn post oak split on the property, about a cord and a half a week. No gas assist, no pellet hopper, no thermometer with a battery in it. If the fire's wrong, the meat waits. So do you, and it'll be worth it.
            - generic [ref=e62]:
              - heading "Pitmaster Hours" [level=3] [ref=e63]
              - generic [ref=e64]:
                - term [ref=e65]: Thu – Fri
                - definition [ref=e66]: 11 a.m. till sold out (usually 2 p.m.)
                - term [ref=e67]: Saturday
                - definition [ref=e68]: 11 a.m. till sold out (usually 12:45 p.m.)
                - term [ref=e69]: Sunday
                - definition [ref=e70]: Noon till sold out — church first
                - term [ref=e71]: Mon – Wed
                - definition [ref=e72]: Dark. The pit rests and so does Marla.
    - region "Line etiquette" [ref=e73]:
      - generic [ref=e74]:
        - heading "Line Etiquette" [level=2] [ref=e75]
        - paragraph [ref=e76]: The line forms at the oak fence and moves faster than it looks. Mind a few rules and everybody eats happy.
        - list [ref=e77]:
          - listitem [ref=e78]:
            - generic [ref=e79]: Rule the first
            - strong [ref=e80]: Hold your spot, not your whole group's.
            - text: One body in line per tray you're buying. Saving space for seven cousins who left for breakfast tacos is how fights start.
          - listitem [ref=e81]:
            - generic [ref=e82]: Rule the second
            - strong [ref=e83]: Know your order by the time you hit the counter.
            - text: It's three meats and three sides, friend. The menu's been on this page the whole time.
          - listitem [ref=e84]:
            - generic [ref=e85]: Rule the third
            - strong [ref=e86]: First-timers get a burnt end while they wait.
            - text: Tell Marla it's your first visit and she'll cut you one off the point. Tipping it back is considered poor manners.
          - listitem [ref=e87]:
            - generic [ref=e88]: Rule the fourth
            - strong [ref=e89]: "\"Sold out\" means sold out."
            - text: The stamp doesn't negotiate. Come earlier tomorrow — the pit's been lit since four, same as ever.
