        - paragraph [ref=f21e138]:
          - text: Most networks promise weekly and ship "whenever." Here's the actual board. If a show slips, we say so in the feed —
          - strong [ref=f21e139]: no filler episodes, no reruns dressed up as new.
        - paragraph [ref=f21e140]: Between seasons, feeds go quiet on purpose. Silence is part of the format. You'll get one short tape when a season returns, never a countdown of countdowns.
