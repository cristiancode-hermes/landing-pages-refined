        - paragraph [ref=f12e13]: One model since 1989 · Bellingham, Washington
        - heading [level=1] [ref=f12e14]:
          - text: One boot. Built once.
          - emphasis [ref=f12e15]: Rebuilt forever.
        - paragraph [ref=f12e16]: The Meriden is the only boot we make. Full-grain steerhide, a sole you can replace, and a last we've been arguing about for thirty-seven years. When it's right, you stop thinking about your feet.
