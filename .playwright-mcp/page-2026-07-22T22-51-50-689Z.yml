        - img "A Meriden boot resting on granite above the tree line, laces still damp from the morning creek ford." [ref=f12e21]
    - generic [ref=f12e24]:
      - generic [ref=f12e25]:
        - heading "The Meriden, six-inch. That's the whole catalog." [level=2] [ref=f12e26]
        - paragraph [ref=f12e27]: We tried a second model in 1994. It distracted us for a season, so we killed it. Everything we know goes into one pattern, cut from one hide lot at a time, stitched in a shop where the radio is always slightly too loud.
        - paragraph [ref=f12e28]: $385 — resoles $85, for life
        - paragraph [ref=f12e29]: Free shipping both ways on resoles. No sales, ever; the price is the price.
      - generic [ref=f12e30]:
        - generic [ref=f12e31]:
          - term [ref=f12e32]: Upper
          - definition [ref=f12e33]: 2.4 mm full-grain steerhide, one piece per quarter, waxed in-house
        - generic [ref=f12e34]:
