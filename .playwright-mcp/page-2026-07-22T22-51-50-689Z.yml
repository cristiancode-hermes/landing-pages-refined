    - generic [ref=f12e47]:
      - generic [ref=f12e48]:
        - heading "Send them back tired. They come home ready." [level=2] [ref=f12e49]
        - paragraph [ref=f12e50]: "A stitched sole is a promise: when the lugs wear smooth, you don't throw the boot away. Strip the outsole, inspect the welt, rebuild from the midsole down. Three weeks, door to door, and the upper — the part that's molded to your foot — never leaves the story."
        - paragraph [ref=f12e51]: "Pair #0031 has been resoled nine times. Its owner walked it through three decades and two careers. The leather is darker now, softer at the ankle, and better than the day it shipped."
        - paragraph [ref=f12e52]: $85 a resole, for as long as you own the boots. Drag the handle to see what nine resoles buys you.
      - figure "Same bench, three weeks apart. The upper is the part worth keeping." [ref=f12e53]:
