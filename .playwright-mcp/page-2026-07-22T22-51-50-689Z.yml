    - generic [ref=f12e60]:
      - heading "Our sizing is honest, which means it's a little strange." [level=2] [ref=f12e61]
      - generic [ref=f12e62]:
        - generic [ref=f12e63]:
          - paragraph [ref=f12e64]: Between sizes? Size down.
          - paragraph [ref=f12e65]: The Meriden runs long in the toe on purpose — your foot swells at mile twelve, and a boot that fits at 8 a.m. shouldn't cripple you at 4 p.m. The heel stays snug so you don't blister.
        - generic [ref=f12e66]:
          - paragraph [ref=f12e67]: Measure in centimeters. Trust the chart.
          - paragraph [ref=f12e68]: "If vanity sizing has burned you before, skip the guesswork: stand on a piece of paper, trace, measure heel to longest toe, and match it to the chart. Two widths, every size, no upcharge."
        - generic [ref=f12e69]:
          - paragraph [ref=f12e70]: Wrong size? We swap it, free.
          - paragraph [ref=f12e71]: Wear them around the house for a week. Carpet only. If they're wrong, send them back and the right pair ships before yours lands. About 6% of orders swap — we'd rather know.
