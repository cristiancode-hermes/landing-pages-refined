    - generic [ref=f13e40]:
      - generic [ref=f13e41]:
        - heading "The gilding, in four unhurried movements" [level=2] [ref=f13e42]
        - paragraph [ref=f13e43]: Every truffle passes through the same four hands. The gold is edible 24-karat leaf, applied sheet by sheet with squirrel-hair brushes — no sprays, no shortcuts.
      - list [ref=f13e44]:
        - listitem [ref=f13e45]:
          - heading "Temper" [level=3] [ref=f13e46]
          - paragraph [ref=f13e47]: The couverture is brought to 31.2°C by marble and patience. A degree higher and the snap dulls; a degree lower and the shine never sets.
        - listitem [ref=f13e48]:
          - heading "Shell" [level=3] [ref=f13e49]
          - paragraph [ref=f13e50]: Each shell is cast at exactly 1.4 mm — thin enough to crack under a tooth, thick enough to hold a ganache at full humidity.
        - listitem [ref=f13e51]:
          - heading "Fill" [level=3] [ref=f13e52]
          - paragraph [ref=f13e53]: Ganache is piped at 27°C and rested sixteen hours. The crimson-heart batches get a single drop of raspberry distillate at the center.
        - listitem [ref=f13e54]:
          - heading "Gild" [level=3] [ref=f13e55]
          - paragraph [ref=f13e56]: One sheet of gold leaf per truffle, laid by hand. About one in twenty tears — those become the chocolatiers' lunch, never your box.
