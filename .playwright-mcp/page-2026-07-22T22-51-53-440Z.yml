    - generic [ref=f13e22]:
      - generic [ref=f13e23]:
        - heading "One valley. One harvest. Nothing else in the bar." [level=2] [ref=f13e24]
        - paragraph [ref=f13e25]: Our cacao comes from a single cooperative of fourteen families along the Ucayali River in Peru. The beans travel once, by boat and then by rail, and arrive in Lyon still smelling of the fermentation boxes — banana, black plum, wet earth.
        - paragraph [ref=f13e26]: We pay 2.4× the commodity price, fixed for five harvests, so the cooperative can plan grafting cycles instead of chasing spot markets. You taste the difference as a long, quiet finish instead of a bitter shout.
        - list [ref=f13e27]:
          - listitem [ref=f13e28]:
