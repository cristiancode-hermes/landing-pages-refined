      - paragraph [ref=f13e10]: Bean-to-bar atelier · Est. 2014 · Lyon
      - heading "Chocolate patient enough to wear gold." [level=1] [ref=f13e11]
      - paragraph [ref=f13e12]: One valley, one harvest, one weekly batch of six hundred bars. We roast slow, conche for seventy-two hours, and lay edible 24-karat leaf on every truffle by hand — because haste is the one ingredient we refuse.
      - generic [ref=f13e13]:
        - link "Taste the Collection" [ref=f13e14] [cursor=pointer]:
