  - banner [ref=f10e2]:
    - generic:
      - heading "STATIC_BLOOM" [level=1]:
        - text: STATIC
        - emphasis: _
        - text: BLOOM
      - paragraph: A generative art collective. Nine members, one renderer, no saved states. Everything you see here was computed a moment ago and will never exist again.
      - paragraph: 52.5200°N 13.4050°E · EST. 2019 · SEED UNSTABLE
  - main [ref=f10e4]:
    - region [ref=f10e5]:
      - generic [ref=f10e6]:
        - heading "The rules we render by" [level=2] [ref=f10e7]
        - paragraph [ref=f10e8]: Static Bloom is a collective, not a studio. Nobody signs anything. The rules below are the entire contract — they were compiled in 2019 and have never thrown an exception.
        - list [ref=f10e9]:
          - listitem [ref=f10e10]:
            - generic [ref=f10e11]: RULE_01
            - paragraph [ref=f10e12]:
              - strong [ref=f10e13]: No saved states.
              - text: A work exists only while it renders. If you loved it, you loved a moment, not a file.
          - listitem [ref=f10e14]:
            - generic [ref=f10e15]: RULE_02
            - paragraph [ref=f10e16]:
              - strong [ref=f10e17]: The seed is public.
              - text: Every exhibited piece ships with its seed and commit hash. If you can recreate it, you collaborated.
          - listitem [ref=f10e18]:
            - generic [ref=f10e19]: RULE_03
            - paragraph [ref=f10e20]:
              - strong [ref=f10e21]: No neural networks.
              - text: Noise, fields, L-systems, feedback loops. If a GPU can dream it, we are not interested in its dreams.
          - listitem [ref=f10e22]:
            - generic [ref=f10e23]: RULE_04
            - paragraph [ref=f10e24]:
              - strong [ref=f10e25]: Phosphor over pigment.
              - text: We are a screen practice. Prints exist only to fund the electricity.
          - listitem [ref=f10e26]:
            - generic [ref=f10e27]: RULE_05
            - paragraph [ref=f10e28]:
              - strong [ref=f10e29]: Delete something at every meeting.
              - text: The codebase gets smaller or it gets forked. Both have happened.
    - region [ref=f10e30]:
