    - region [ref=f8e86]:
      - generic [ref=f8e87]:
        - heading "The pool is 82 degrees and lit from below" [level=2] [ref=f8e88]
        - paragraph [ref=f8e89]: It is not big. It is not heated by anything but the day it just sat through. But at eleven at night, with the light glowing up through the water and the highway gone quiet, it is the best seat in the county. Open till the last porch light goes off — usually room 9, usually around one.
    - region [ref=f8e90]:
      - generic [ref=f8e91]:
        - heading "About the ice machine" [level=2] [ref=f8e92]
        - generic [ref=f8e93]:
          - paragraph [ref=f8e94]: People ask about the ice machine. It is the loudest thing on the property — louder than the trains, louder than Earl's truck. It kicks on at 6:40 every morning like a small engine refusing to die, and it has done this since 1974.
          - paragraph [ref=f8e95]:
            - strong [ref=f8e96]: The ice is free and it is endless.
            - text: Bring your cooler, bring your bucket, bring the good plastic tub from your mother-in-law's. The machine does not judge. It only roars, and fills, and roars again. If it ever stops, we will know the world has truly ended — and room 3 gets it free.
