            - text: Dough is a patient thing.
            - emphasis [ref=e29]: We don't rush it.
          - paragraph [ref=e30]: Every ball of dough at Ember & Oak starts two days before you sit down. Caputo flour, water, sea salt, a whisper of starter — then forty-eight hours cold, slow, and undisturbed in the basement. It comes up to room temperature at noon and meets the fire at five.
          - paragraph [ref=e31]: What lands on your table is leopard-spotted, soft in the middle, crisp at the rim — the way a pizza behaves when the oven is hot enough to be a little scary.
          - list [ref=e32]:
            - listitem [ref=e33]: 48-hour cold ferment
            - listitem [ref=e34]: Oregon white oak
            - listitem [ref=e35]: 90-second bake
            - listitem [ref=e36]: Fior di latte, made daily
        - figure "The morning stretch — dough comes up from the cellar at noon sharp." [ref=e37]:
          - img "Hands stretching a ball of forty-eight-hour dough on the flour-dusted oak bench" [ref=e38]
